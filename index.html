<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Путівник">
<title>Путівник</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: map-first app. Phone: full-screen map, swipeable stop rail at the bottom, details in a bottom sheet.
   Desktop: map left, stop list + details panel on the right. */
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --surface-2: #efebe3;
  --text: #1d1d1b;
  --muted: #6b675f;
  --border: #e0dbd0;
  --day1: #d9480f;
  --day2: #1c6dd0;
  --opt: #2b8a3e;
  --accent: #8a5a00;
  --accent-strong: #f0b84a;
  --done: #2b8a3e;
  --transit: #7048e8;
  --warn-bg: #fff4dc;
  --warn-text: #6b4a00;
  --shadow: 0 6px 24px rgba(30, 25, 10, .16);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --surface: #1e1e1b; --surface-2: #2a2924; --text: #ecebe6; --muted: #a29e94;
    --border: #36342d; --day1: #ff7a45; --day2: #5aa2ff; --opt: #5cc06e; --accent: #f0b84a;
    --done: #5cc06e; --transit: #9775fa; --warn-bg: #33290f; --warn-text: #f3d48a;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1e1e1b; --surface-2: #2a2924; --text: #ecebe6; --muted: #a29e94;
  --border: #36342d; --day1: #ff7a45; --day2: #5aa2ff; --opt: #5cc06e; --accent: #f0b84a;
  --done: #5cc06e; --transit: #9775fa; --warn-bg: #33290f; --warn-text: #f3d48a;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: var(--day2); }

/* ---------- top bar ---------- */
.topbar {
  position: fixed; inset: 0 0 auto; z-index: 1000;
  padding: env(safe-area-inset-top, 0px) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.topbar-row { height: var(--top-h); display: flex; align-items: center; gap: 8px; }
.days { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 12px; }
.day-btn { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer; }
.day-btn[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.progress { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.progress b { color: var(--done); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; height: 36px; padding: 0 11px; font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

/* ---------- app area ---------- */
.app { position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--top-h) + 1px + env(safe-area-inset-top, 0px)); }
#map { position: absolute; inset: 0; background: var(--surface-2); z-index: 0; }
.map-btns { position: absolute; z-index: 500; top: 10px; right: max(10px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
.map-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; }
.map-btn svg { width: 22px; height: 22px; }
.map-btn.on { color: var(--day2); }
.leaflet-control-attribution { font-size: 10px; }

/* ---------- rail of stops ---------- */
.rail {
  position: absolute; z-index: 600; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
  padding: 4px max(16px, env(safe-area-inset-left, 0px)) 6px; scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }
.rail-spacer { flex: 0 0 calc(50vw - min(41vw, 170px) - 26px); }
.stop-card {
  flex: 0 0 min(82vw, 340px); scroll-snap-align: center; display: grid; grid-template-columns: 78px minmax(0, 1fr) 40px; gap: 10px;
  align-items: center; padding: 9px; border-radius: 16px; background: var(--surface); border: 2px solid transparent;
  box-shadow: var(--shadow); cursor: pointer; text-align: left;
}
.stop-card.active { border-color: var(--accent-strong); }
.stop-card.done { opacity: .78; }
.sc-thumb { width: 78px; height: 78px; border-radius: 11px; background: var(--surface-2) center / cover no-repeat; display: grid; place-items: center; font-weight: 700; color: var(--muted); }
.sc-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.badge { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; color: #fff; font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; }
.badge.hotel { background: #111; border-radius: 5px; }
.badge.station { background: #5f3dc4; border-radius: 5px; }
.sc-title { margin: 2px 0 3px; font-size: 15px; line-height: 1.25; font-weight: 650; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sc-leg { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.visit-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border); background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.visit-btn svg { width: 20px; height: 20px; }
.visit-btn[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: #fff; }
.rail-end { flex: 0 0 min(60vw, 240px); scroll-snap-align: center; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); padding: 14px; font-size: 13.5px; display: grid; gap: 8px; align-content: center; }

/* ---------- details sheet ---------- */
.sheet {
  position: fixed; z-index: 1100; left: 0; right: 0; bottom: 0; max-height: 80dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.25);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  transform: translateY(105%); transition: transform .28s ease; visibility: hidden;
}
.sheet.open { transform: none; visibility: visible; }
.sheet-grip { position: sticky; top: 0; z-index: 2; background: var(--surface); padding: 8px 0 6px; display: grid; justify-items: center; cursor: grab; touch-action: none; }
.sheet-grip span { width: 42px; height: 5px; border-radius: 3px; background: var(--border); }
.sheet-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.sheet-head h2 { margin: 4px 0 0; font-size: 20px; line-height: 1.2; text-wrap: balance; }
.close-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 20px; cursor: pointer; }
.slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; margin: 12px -4px 4px; padding: 0 4px; scrollbar-width: none; }
.slides::-webkit-scrollbar { display: none; }
.slides button { flex: 0 0 86%; padding: 0; border: 0; border-radius: 14px; overflow: hidden; scroll-snap-align: center; background: var(--surface-2); cursor: zoom-in; aspect-ratio: 4 / 3; max-width: 100%; }
.slides img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slide-count { font-size: 11.5px; color: var(--muted); text-align: center; }
.sheet p { margin: 10px 0; line-height: 1.5; }
.price { display: inline-block; font-size: 13px; font-weight: 650; color: var(--accent); background: var(--surface-2); padding: 4px 10px; border-radius: 999px; }
.visit-wide { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin: 12px 0 4px; height: 46px; border-radius: 12px; border: 2px solid var(--done); background: transparent; color: var(--done); font-weight: 700; cursor: pointer; }
.visit-wide[aria-pressed="true"] { background: var(--done); color: #fff; }
.visit-wide svg { width: 20px; height: 20px; }
.box { margin-top: 12px; padding: 12px; border-radius: 14px; background: var(--surface-2); font-size: 14px; }
.box-title { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.row { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; padding: 2px 0; }
.row b { font-weight: 650; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.btn { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 42px; padding: 6px 10px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 650; font-size: 13.5px; text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--day2); border-color: var(--day2); color: #fff; }
.btn.buy { background: var(--accent-strong); border-color: var(--accent-strong); color: #1d1d1b; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips a { font-size: 13px; font-weight: 600; text-decoration: none; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.chips a.buy { background: var(--accent-strong); border-color: var(--accent-strong); color: #1d1d1b; }
.sheet-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }

/* ---------- map pins ---------- */
.pin { width: 28px; height: 28px; border-radius: 50%; color: #fff; font: 700 12.5px var(--font); display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); transition: transform .15s; }
.pin.done { background: var(--done) !important; }
.pin.active { transform: scale(1.35); box-shadow: 0 0 0 4px var(--accent-strong), 0 2px 8px rgba(0,0,0,.5); }
.pin svg { width: 14px; height: 14px; }
.landmark { display: flex; align-items: center; gap: 4px; white-space: nowrap; width: max-content; }
.landmark .pin { flex: none; border-radius: 7px; }
.landmark span { background: #fff; color: #111; font: 600 11.5px var(--font); padding: 2px 6px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.me-dot { width: 16px; height: 16px; border-radius: 50%; background: #1c7cff; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(28,124,255,.25); }

/* ---------- info panel ---------- */
.panel { position: fixed; inset: 0; z-index: 1200; background: var(--bg); overflow-y: auto; display: none; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.panel.open { display: block; }
.panel-head { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.panel-head h2 { margin: 0; font-size: 18px; }
.panel-body { max-width: 980px; margin: 0 auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.panel-body h2 { font-size: 19px; margin: 26px 0 10px; }
.panel-body h3 { font-size: 15px; margin: 0 0 6px; }
.panel-body p { margin: 0 0 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.note { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin: 12px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.grid .card p { font-size: 14px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.best td { background: color-mix(in srgb, var(--opt) 13%, transparent); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
ul { margin: 0; padding-left: 20px; } li { margin-bottom: 6px; }
.src { font-size: 13px; color: var(--muted); }
.reset-btn { margin-top: 10px; }

/* ---------- lightbox ---------- */
.lightbox { position: fixed; inset: 0; z-index: 1300; background: rgba(0,0,0,.94); display: none; flex-direction: column; align-items: center; justify-content: center; padding: calc(56px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 74dvh; border-radius: 8px; object-fit: contain; }
.lb-title { color: #fff; font-weight: 650; margin-bottom: 10px; text-align: center; }
.lb-cap { color: #cfcfcf; font-size: 12px; margin-top: 10px; text-align: center; max-width: 680px; }
.lb-cap a { color: #9cc7ff; }
.lb-btn { position: absolute; background: rgba(255,255,255,.16); color: #fff; border: 0; width: 46px; height: 46px; border-radius: 50%; font-size: 26px; line-height: 1; cursor: pointer; }
.lb-prev { left: 10px; top: 50%; transform: translateY(-50%); }
.lb-next { right: 10px; top: 50%; transform: translateY(-50%); }
.lb-close { right: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); }

.toast { position: fixed; z-index: 1400; left: 50%; top: calc(var(--top-h) + 14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13.5px; max-width: calc(100vw - 32px); box-shadow: var(--shadow); display: none; }
.toast.show { display: block; }
:focus-visible { outline: 2px solid var(--day2); outline-offset: 2px; }

/* ---------- desktop ---------- */
@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; }
  #map { position: relative; inset: auto; height: 100%; }
  .side { position: relative; overflow: hidden; border-left: 1px solid var(--border); background: var(--bg); }
  .rail { position: absolute; inset: 0; flex-direction: column; overflow-y: auto; overflow-x: hidden; scroll-snap-type: none; padding: 12px; }
  .rail-spacer { display: none; }
  .stop-card { flex: 0 0 auto; box-shadow: none; border-color: var(--border); }
  .stop-card.active { border-color: var(--accent-strong); }
  .rail-end { flex: 0 0 auto; box-shadow: none; border: 1px solid var(--border); }
  .sheet { position: absolute; max-height: none; top: 0; border-radius: 0; box-shadow: none; transform: translateX(105%); }
  .sheet.open { transform: none; }
  .sheet-grip { display: none; }
  .sheet-head { padding-top: 14px; }
}
@media (max-width: 899px) { .side { display: contents; } }
@media (max-width: 380px) { .day-btn { padding: 7px 9px; } .progress { font-size: 11.5px; } }
@media (prefers-reduced-motion: reduce) { .sheet, .pin { transition: none; } }

.lock { position: fixed; inset: 0; z-index: 5000; display: grid; place-items: center; background: var(--bg);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
.lock-card { width: min(340px, 100%); display: grid; gap: 12px; justify-items: center; text-align: center; }
.lock-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--surface-2); display: grid; place-items: center; color: var(--accent); }
.lock-icon svg { width: 28px; height: 28px; }
.lock-card h1 { margin: 4px 0 0; font-size: 22px; }
.lock-card p { margin: 0; color: var(--muted); }
.lock-card input[type="password"] { width: 100%; height: 56px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface);
  color: var(--text); font: 600 26px/1 var(--font); letter-spacing: .5em; text-align: center; padding-left: .5em; font-variant-numeric: tabular-nums; }
.lock-card input[type="password"]:focus { outline: none; border-color: var(--day2); }
.lock-remember { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.lock-remember input { width: 18px; height: 18px; }
.lock-card .btn { width: 100%; height: 48px; }
.lock-error { min-height: 20px; color: var(--day1); font-weight: 600; font-size: 14px; }
.lock.busy .lock-card { opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<div class="lock" id="lock">
  <form class="lock-card" id="lock-form" autocomplete="off">
    <div class="lock-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>Путівник</h1>
    <p id="lock-hint">Введіть PIN із 6 цифр</p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="PIN">
    <label class="lock-remember"><input type="checkbox" id="remember" checked> Запам'ятати на цьому телефоні</label>
    <button class="btn primary" type="submit">Відкрити</button>
    <div class="lock-error" id="lock-error" role="alert"></div>
  </form>
</div>

const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decryptVault(pin) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: fromB64(VAULT.salt), iterations: VAULT.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(VAULT.iv) }, key, fromB64(VAULT.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function launch(app) {
  document.getElementById("lock").remove();
  document.body.insertAdjacentHTML("afterbegin", app.html);
  const script = document.createElement("script");
  script.textContent = app.js;
  document.body.appendChild(script);
}

async function tryPin(pin, remember) {
  let app;
  try { app = await decryptVault(pin); } catch { return false; }
  if (remember) { try { localStorage.setItem("prague:pin", pin); } catch {} }
  launch(app);
  return true;
}

const lockEl = document.getElementById("lock");
const form = document.getElementById("lock-form");
const input = document.getElementById("pin");
const errorEl = document.getElementById("lock-error");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!/^\d{6}$/.test(input.value)) { errorEl.textContent = "PIN має 6 цифр"; return; }
  lockEl.classList.add("busy");
  errorEl.textContent = "";
  const ok = await tryPin(input.value, document.getElementById("remember").checked);
  if (!ok) {
    lockEl.classList.remove("busy");
    errorEl.textContent = "Невірний PIN";
    input.value = "";
    input.focus();
  }
});
input.addEventListener("input", () => {
  input.value = input.value.replace(/\D/g, "").slice(0, 6);
  if (input.value.length === 6) form.requestSubmit();
});

(async () => {
  if (!window.crypto?.subtle) {
    errorEl.textContent = "Браузер не підтримує розшифрування. Відкрийте сторінку через https.";
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem("prague:pin"); } catch {}
  if (saved) {
    lockEl.classList.add("busy");
    document.getElementById("lock-hint").textContent = "Відкриваю...";
    if (await tryPin(saved, false)) return;
    try { localStorage.removeItem("prague:pin"); } catch {}
    lockEl.classList.remove("busy");
    document.getElementById("lock-hint").textContent = "Введіть PIN із 6 цифр";
  }
  input.focus();
})();
</script>
